# ==========================================
#  🔋 BATTERY & WIRELESS POWER MANAGEMENT
# ==========================================

# Disable deep sleep to prevent the long wake delay, but use idle state instead
CONFIG_ZMK_SLEEP=n

# Idle state after 5 minutes of total inactivity (5 * 60 * 1000 milliseconds)
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Supercharge the Bluetooth signal strength so you get zero latency or drops
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable RGB Underglow (Required to compile the Zephyr led_strip driver)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Save LED and other settings to flash so they persist after reboot
CONFIG_SETTINGS=y

# Turn off LEDs when the keyboard goes idle (after 5 mins)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

CONFIG_ZMK_BATTERY_REPORTING=n

# ⚡ FORCE USB RE-ENUMERATION
CONFIG_USB_DEVICE_PID=0x615F

# Enable USB Boot protocol to fix Windows lock screen/BIOS issues
CONFIG_ZMK_USB_BOOT=y

# ⚡ POLLING RATE (1000Hz / 1ms)
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_HID_DEVICE_COUNT=2

# ⚡ DEBOUNCE DELAY
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# 🌐 ZMK STUDIO (BACKEND FOR CUSTOM WEB APP)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# 📶 BLUETOOTH
CONFIG_ZMK_BLE=y